
model_type: "isolation_forest"

metadata:
  name: "graph model 1.4"
  version: "v4.0"
  description: "Isolation forest and UMAP trained on graph_pipeline_v1_0 with much higher n_neighbors"

config:
  data: "data/graph_pipeline_v1_0/graph_pipeline_all.csv"
  outfile_dir: "results/graph_model1_4"
  random_seed: 42
  ignore_cols:
    - "userId"

  umap:
    n_neighbors: 300
    min_dist: 0.6
    metric: "euclidean"

